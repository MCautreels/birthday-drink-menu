<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe0ea">
  <title>Drankkaart Mila & Vik</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="confetti" id="confetti"></div>
    <button class="my-orders-btn" id="myOrdersBtn" hidden></button>
    <div class="ages"><span class="age mila">8</span><span class="age vik">4</span></div>
    <h1>Mila <span class="amp">&amp;</span> Vik</h1>
    <p>Drankkaart van het verjaardagsfeest 🎉</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Categorieën"></nav>
  <main id="menu"></main>
  <footer class="credits">
    Productfoto's: <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> (CC BY-SA)
  </footer>

  <button class="cart-bar" id="cartBar">
    <span><span class="count" id="cartCount">0</span>Mijn bestelling</span>
    <span class="go">Bekijken →</span>
  </button>

  <div class="overlay" id="overlay"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <button class="close" id="sheetClose" aria-label="Sluiten">✕</button>
    <div id="sheetBody"></div>
  </section>
  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/ntfy.js"></script>
  <script src="js/drinks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
